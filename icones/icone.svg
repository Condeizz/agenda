<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ícone da Minha Agenda. Fonte dos PNG: node ferramentas/icones.mjs (desenha este SVG num navegador).
       Tudo o que importa fica no círculo central de 80% (zona segura dos ícones "maskable" do Android). -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F73FF"/>
      <stop offset="1" stop-color="#5B3FD6"/>
    </linearGradient>
    <radialGradient id="brilho" cx=".22" cy=".12" r=".75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faixa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A66"/>
      <stop offset="1" stop-color="#F2553F"/>
    </linearGradient>
    <linearGradient id="folha" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF1FF"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D47A"/>
      <stop offset="1" stop-color="#16A55A"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1A1060" flood-opacity=".35"/>
    </filter>
    <filter id="sombra2" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0B5A2E" flood-opacity=".35"/>
    </filter>
    <clipPath id="recorte"><rect x="112" y="128" width="288" height="268" rx="52"/></clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#fundo)"/>
  <rect width="512" height="512" fill="url(#brilho)"/>

  <!-- a folha do calendário -->
  <g filter="url(#sombra)">
    <rect x="112" y="128" width="288" height="268" rx="52" fill="url(#folha)"/>
  </g>
  <g clip-path="url(#recorte)">
    <rect x="112" y="128" width="288" height="78" fill="url(#faixa)"/>
    <rect x="112" y="200" width="288" height="6" fill="#000" opacity=".06"/>
  </g>
  <!-- argolas -->
  <rect x="178" y="100" width="26" height="62" rx="13" fill="#FFFFFF"/>
  <rect x="308" y="100" width="26" height="62" rx="13" fill="#FFFFFF"/>
  <rect x="178" y="138" width="26" height="24" rx="12" fill="#D93F2B" opacity=".35"/>
  <rect x="308" y="138" width="26" height="24" rx="12" fill="#D93F2B" opacity=".35"/>

  <!-- linhas de tarefa e o "feito" -->
  <rect x="152" y="246" width="118" height="20" rx="10" fill="#C9D2F5"/>
  <rect x="152" y="290" width="88" height="20" rx="10" fill="#DDE3FA"/>
  <rect x="152" y="334" width="104" height="20" rx="10" fill="#DDE3FA"/>
  <g filter="url(#sombra2)">
    <circle cx="330" cy="318" r="50" fill="url(#ok)"/>
  </g>
  <path d="M306 318 l17 17 l32 -34" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
